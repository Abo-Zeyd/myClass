name: Complete Supabase database backup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    # This workflow is a template in the public app repo. Run it only after
    # copying it to the private backup repo and setting BACKUP_REPOSITORY there.
    if: ${{ github.repository == vars.BACKUP_REPOSITORY }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Verify backup repository is private
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          visibility="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.visibility')"
          if [[ "${visibility}" != "private" ]]; then
            echo "Refusing to store a database backup in a non-private repository." >&2
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Create schema, roles, and data dumps
        id: dump
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_DB_URL}" ]]; then
            echo "Missing the SUPABASE_DB_URL repository secret." >&2
            exit 1
          fi

          mkdir -p backup-output
          supabase db dump --db-url "${SUPABASE_DB_URL}" --role-only --file backup-output/roles.sql
          supabase db dump --db-url "${SUPABASE_DB_URL}" --file backup-output/schema.sql
          supabase db dump --db-url "${SUPABASE_DB_URL}" --data-only --use-copy -x "storage.buckets_vectors" -x "storage.vector_indexes" --file backup-output/data.sql

      - name: Store backup as a private artifact
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: backup-output/*.sql
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Add download instructions to the run summary
        shell: bash
        run: |
          {
            echo "## Database backup is ready"
            echo "Download the ZIP file from this private workflow run's Artifacts section."
            echo "The artifact expires after 30 days."
          } >> "${GITHUB_STEP_SUMMARY}"
